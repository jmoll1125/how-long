<!doctype html>
<!-- 2.13.26, 3.22.26, 3.28.26-->
<html>
<head>
<title>How long does it take?</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style type="text/css">
p, a, em, b, u, td, ol, li, pre, label, input {font-family: Georgia, Verdana, sans-serif; font-size: 18px;}
h1, h2, h3 {font-family: Verdana, sans-serif;}
.error {color: rgb(199, 97, 90); }
input {width: 60px; }
</style>
</head>
<body>
<h1>How long does it take?</h1>
<p>It takes <span id="res"></span> to go <input type="number" inputmode="decimal" id="dist" value="60" onchange="calc()"></input> miles at <input type="number" inputmode="decimal" id="mph" value="60" onchange="calc()"></input> mph</p>
<p id="results"></p>
<script>
function calc() {
	let speed = document.getElementById("mph").value;
	let distance = document.getElementById("dist").value;
	speed = parseInt(speed);
	distance = parseInt(distance);
	let time = distance/speed; //hours
	let hours = Math.floor(time);
	let mins = Math.floor((time - hours)*60);
	let secs = Math.floor((((time - hours)*60)-mins)*60);
	let output = ""
	if (hours !== 0) {
		output+= hours+"h "
	};	
	if (mins !== 0) {
		output+= mins+"m "
	};
	if (secs !== 0) {
		output+= secs+"s "
	};
	//output = "It takes "+output+"to go one mile at "+document.getElementById("mph").value+ " mph.";
	if (speed <= 0 || distance <= 0 || Number.isNaN(speed*distance) ) {
		output = "Error!";
		document.getElementById("res").classList.add("error");
		} else {
		document.getElementById("res").classList.remove("error");
		};
	document.getElementById("res").innerText = output;
	};
calc();
</script>
